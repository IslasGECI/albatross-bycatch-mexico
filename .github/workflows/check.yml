name: Check spelling and style
on:
  push:
    branches:
      - develop
jobs:

  check:
    name: Check manuscripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Pull Docker image
        run: docker pull islasgeci/albatross-bycatch-mexico:latest
      - name: Check manuscripts
        run: docker run --volume $PWD:/workdir islasgeci/albatross-bycatch-mexico:latest make check

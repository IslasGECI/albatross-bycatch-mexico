name: Check spelling and style
on:
  push:
    branches:
      - develop
jobs:

  check:
    name: Check manuscripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Pull Docker image
        run: docker pull islasgeci/albatross-bycatch-mexico:latest
      - name: Build the development image
        run: docker compose --profile develop build develop
      - name: Check manuscripts
        run: docker compose --profile develop run --rm develop make check

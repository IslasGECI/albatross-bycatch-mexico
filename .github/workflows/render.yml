name: Render papers
on:
  schedule:
    - cron: '0 7 * * 3'
  workflow_dispatch:
jobs:
  build-image:
    name: Build Docker image, generate papers, and upload results
    runs-on: ubuntu-latest
    env:
      BITBUCKET_API_TOKEN: ${{ secrets.BITBUCKET_API_TOKEN }}
      BITBUCKET_EMAIL: ${{ secrets.BITBUCKET_EMAIL }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
    steps:
    - name: Checkout repo
      uses: actions/checkout@main
    - name: Build the production image
      run: docker compose build islasgeci
    - name: 🐋🔏 Docker log-in
      run: echo "${DOCKER_PASSWORD}" | docker login -u "${DOCKER_USERNAME}" --password-stdin
    - name: 🌎🦆🎣🛥️ Generate papers
      run: docker compose run --rm islasgeci make all
    - name: ⏫🏛️ Upload draft
      uses: actions/upload-artifact@main
      with:
        name: paper_results
        path: |
          data/processed/*.csv
          reports/*.docx
          reports/*.pdf
          reports/figures/*.png
        retention-days: 14
    - name: Push latest Docker image to Docker Hub
      run: docker push islasgeci/albatross-bycatch-mexico:latest
    - name: Push four-digit week tag to Docker Hub
      run: |
        four_digit_week=$(date +%y%V)
        docker tag islasgeci/albatross-bycatch-mexico:latest islasgeci/albatross-bycatch-mexico:${four_digit_week}
        docker push islasgeci/albatross-bycatch-mexico:${four_digit_week}
